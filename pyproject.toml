[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sunergy"
version = "0.1.0"
description = "Evidence-first PV application scaffold; calculations pending reproduction"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "tzdata>=2025.1",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "httpx2>=2.13.1,<3",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
  "types-pyyaml>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/sunergy"]

[tool.hatch.build.targets.sdist]
include = ["/backend/src", "/pyproject.toml", "/README.md", "/uv.lock"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend/src"]
extend-exclude = ["legacy", "frontend", ".cache", ".local"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["backend/src", "backend/tests", "scripts"]
strict = true
mypy_path = "backend/src"

