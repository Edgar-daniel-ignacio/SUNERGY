name: Scaffold checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.10"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --locked --offline pytest
      - run: uv run --locked --offline ruff check .
      - run: uv run --locked --offline ruff format --check .
      - run: uv run --locked --offline mypy
      - run: uv run --locked --offline python scripts/export_openapi.py --check
      - run: uv run --locked --offline python scripts/check_repository.py
      - run: uv run --locked --offline python scripts/smoke_test.py
      - run: uv build

  frontend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.10"
          python-version: "3.12"
      - run: uv sync --locked
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run api:check
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run build
      - run: uv run --locked --offline python scripts/smoke_test.py --frontend
