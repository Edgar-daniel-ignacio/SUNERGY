name: Scaffold checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.10"
          python-version: "3.12"
      - run: uv sync --locked
      - name: Diagnose Linux original-source numerical behavior
        if: runner.os == 'Linux'
        run: |
          uv venv .local/legacy-iv-env --python 3.12
          uv pip sync --python .local/legacy-iv-env/bin/python config/legacy-capture/requirements.txt --require-hashes
          .local/legacy-iv-env/bin/python scripts/capture_legacy_iv.py --inputs tests/fixtures/legacy/iv_r/inputs.json --output tests/fixtures/legacy/iv_r/captured_linux
          .local/legacy-iv-env/bin/python scripts/capture_legacy_iv.py --inputs tests/fixtures/legacy/iv_r/inputs_alternate.json --output tests/fixtures/legacy/iv_r/captured_alternate_linux
          .local/legacy-iv-env/bin/python scripts/capture_legacy_iv.py --inputs tests/fixtures/legacy/iv_r/inputs.json --output .local/runs/repeat-linux
          .local/legacy-iv-env/bin/python scripts/capture_legacy_iv.py --inputs tests/fixtures/legacy/iv_r/inputs_alternate.json --output .local/runs/repeat-alternate-linux
          cmp tests/fixtures/legacy/iv_r/captured_linux/outputs.json .local/runs/repeat-linux/outputs.json
          cmp tests/fixtures/legacy/iv_r/captured_alternate_linux/outputs.json .local/runs/repeat-alternate-linux/outputs.json
          uv run --locked --offline python scripts/replay_backend.py --manifest tests/fixtures/legacy/iv_r/captured_linux/manifest.json --manifest tests/fixtures/legacy/iv_r/captured_alternate_linux/manifest.json
      - name: Preserve independent Linux diagnostic captures
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: independent-linux-iv-r
          path: |
            tests/fixtures/legacy/iv_r/captured_linux
            tests/fixtures/legacy/iv_r/captured_alternate_linux
          if-no-files-found: error
      - run: uv run --locked --offline pytest
      - run: uv run --locked --offline ruff check .
      - run: uv run --locked --offline ruff format --check .
      - run: uv run --locked --offline mypy
      - run: uv run --locked --offline python scripts/export_openapi.py --check
      - run: uv run --locked --offline python scripts/check_repository.py
      - run: uv run --locked --offline python scripts/smoke_test.py
      - run: uv build

  frontend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.10"
          python-version: "3.12"
      - run: uv sync --locked
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run api:check
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run build
      - run: uv run --locked --offline python scripts/smoke_test.py --frontend
